name: fleet-telemetry

services:
  certificates:
    image: docker.io/library/alpine:3.24
    command: ["/bin/sh", "/scripts/generate.sh"]
    volumes:
      - ./deploy/certs:/scripts:ro
      - ${SHOWCASES_CA_DIR:-./.certs}:/certs

  traefik:
    image: docker.io/library/traefik:v3.7
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    ports:
      - "${SHOWCASES_HTTP_PORT:-80}:80"
      - "${SHOWCASES_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/traefik:/etc/traefik:ro
      - ${SHOWCASES_CA_DIR:-./.certs}:/certs:ro
    depends_on:
      certificates:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  api:
    build: .
    image: fleet-telemetry:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleet
      SPRING_DATASOURCE_USERNAME: fleet
      SPRING_DATASOURCE_PASSWORD: fleet
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ALLOWED_ORIGINS: https://fleet-dashboard.showcases.chipomho.local
      FLEET_SIMULATOR_TRUCKS: 6
      FLEET_SIMULATOR_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      # Long enough for a cold start on a busy machine; the first passing check ends it early.
      start_period: 300s
      retries: 3

  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 5

  redis:
    image: docker.io/library/redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 5

volumes:
  postgres-data:
